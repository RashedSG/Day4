<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقديم طلب</title>
<style>
  :root{
    --ink:#1d1d1f;
    --sub:#6e6e73;
    --line:#d2d2d7;
    --grey:#f5f5f7;
    --blue:#0071e3;
    --blue-hover:#0077ed;
    --red:#bf4800;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic",
                "Helvetica Neue","Segoe UI",Tahoma,sans-serif;
    font-size:17px;
    line-height:1.47;
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
  }

  .globalnav{
    position:sticky;top:0;z-index:20;
    height:48px;
    background:rgba(255,255,255,.72);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.08);
  }
  .globalnav .inner{
    max-width:1024px;margin:0 auto;height:100%;
    display:flex;align-items:center;gap:28px;
    padding:0 22px;font-size:12px;color:var(--ink);
  }
  .globalnav a{color:inherit;text-decoration:none;opacity:.82}
  .globalnav a:hover{opacity:1}
  .globalnav .brand{font-weight:600;opacity:1}

  .hero{
    text-align:center;
    padding:76px 22px 60px;
  }
  .hero h1{
    font-size:clamp(40px,7vw,64px);
    line-height:1.06;
    font-weight:600;
    letter-spacing:-.022em;
    margin:0 0 12px;
  }
  .hero p{
    font-size:clamp(19px,2.4vw,24px);
    line-height:1.35;
    color:var(--sub);
    font-weight:400;
    margin:0 auto;
    max-width:34ch;
  }

  .panel{
    background:var(--grey);
    padding:60px 22px 80px;
  }
  form{
    max-width:660px;margin:0 auto;
    background:#fff;
    border-radius:18px;
    padding:clamp(26px,5vw,44px);
  }
  .field{margin-bottom:26px}
  label{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-bottom:8px}
  input,select,textarea{
    width:100%;
    font:inherit;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    transition:border-color .2s,box-shadow .2s;
  }
  select{appearance:none;background-image:none}
  textarea{min-height:9.5rem;resize:vertical}
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(0,113,227,.2);
  }
  .hint{font-size:13px;color:var(--sub);margin:8px 2px 0}

  .cta{
    display:block;width:100%;
    font:inherit;font-size:17px;font-weight:500;
    background:var(--blue);color:#fff;
    border:0;border-radius:980px;
    padding:14px 26px;
    cursor:pointer;
    transition:background .2s;
  }
  .cta:hover{background:var(--blue-hover)}
  .cta:focus-visible{outline:4px solid rgba(0,113,227,.35);outline-offset:2px}
  .terms{
    text-align:center;font-size:13px;color:var(--sub);
    margin:18px auto 0;max-width:44ch;
  }

  footer{
    background:var(--grey);
    border-top:1px solid var(--line);
    color:var(--sub);font-size:12px;
    padding:20px 22px;
  }
  footer .inner{max-width:1024px;margin:0 auto}
</style>
</head>
<body>

  <nav class="globalnav">
    <div class="inner">
      <span class="brand">الخدمات الإدارية</span>
      <a href="index.html">تقديم طلب</a>
      <a href="status.php">حالة الطلب</a>
      <a href="help.php">المساعدة</a>
    </div>
  </nav>

  <section class="hero">
    <h1>قدّم طلبك في دقيقة.</h1>
    <p>ثلاثة حقول، ورقم مرجعي يُحفظ فور الإرسال.</p>
  </section>

  <section class="panel">
    <form action="process.php" method="post" novalidate>

      <div class="field">
        <label for="name">الاسم</label>
        <input type="text" id="name" name="name" maxlength="60" autocomplete="name" placeholder="كما هو مسجّل رسميًا" required>
      </div>

      <div class="field">
        <label for="type">نوع الطلب</label>
        <select id="type" name="type" required>
          <option value="">اختر نوعًا</option>
          <option value="إجازة">إجازة</option>
          <option value="شهادة">شهادة</option>
          <option value="صيانة">صيانة</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>

      <div class="field">
        <label for="details">التفاصيل</label>
        <textarea id="details" name="details" maxlength="1000" placeholder="اذكر التواريخ أو الأرقام التي تخصّ طلبك" required></textarea>
        <p class="hint">حتى ١٠٠٠ حرف.</p>
      </div>

      <button class="cta" type="submit">أرسل الطلب</button>
      <p class="terms">تُراجع الطلبات خلال يومي عمل. احتفظ بالرقم المرجعي لمتابعة حالة طلبك من صفحة الحالة.</p>
    </form>
  </section>

  <footer>
    <div class="inner">مكتب الخدمات الإدارية — يوم 4</div>
  </footer>

</body>
</html>
